name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP files
        run: composer lint

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer phpstan

      - name: Check coding style
        run: composer cs-check

      - name: Validate example grammars
        run: composer validate:examples

      - name: Generate example parsers
        run: composer generate:examples

      - name: Run examples
        run: composer run:examples

      - name: Run benchmark smoke test
        run: php benchmarks/arithmetic.php 1000 packed

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
